<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>SAC Team · Admission Tracker</title>
<link rel="icon" href="assets/img/sac-plane-red.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<header class="topbar">
  <div class="logos"><img class="sac" src="assets/img/sac-logo-white.png" alt="SAC"><span class="sep"></span><span style="font-weight:700;letter-spacing:.04em">Admission Tracker · Team</span></div>
  <div class="spacer"></div><span class="who" id="who"></span><button id="chpw" hidden>Change password</button><button id="logout" hidden>Log out</button>
</header>
<div id="demo"></div>
<div id="login" class="login-hero" hidden>
  <form class="login-card" id="loginForm">
    <div class="brand"><img src="assets/img/sac-logo-red.png" alt="SAC"></div>
    <h1>SAC team login</h1>
    <div class="field"><label for="email">Email</label><input id="email" type="email" required autocomplete="username"></div>
    <div class="field"><label for="pw">Password</label><input id="pw" type="password" required autocomplete="current-password"></div>
    <div id="loginErr" class="notice err" hidden></div>
    <button class="btn navy" type="submit">Log in</button>
    <button class="btn ghost small" type="button" id="forgot" style="margin-top:10px;width:100%">Forgot password?</button>
  </form>
  <form class="login-card" id="pwForm" hidden>
    <div class="brand"><img src="assets/img/sac-logo-red.png" alt="SAC"></div>
    <h1>Set your password</h1>
    <p class="muted small">Welcome to the SAC team portal. Choose a password with at least 10 characters. Keep it private.</p>
    <div class="field"><label for="pw1">New password</label><input id="pw1" type="password" minlength="10" required autocomplete="new-password"></div>
    <div class="field"><label for="pw2">Repeat password</label><input id="pw2" type="password" minlength="10" required autocomplete="new-password"></div>
    <div id="pwErr" class="notice err" hidden></div>
    <button class="btn navy" type="submit">Save password</button>
  </form>
</div>
<main id="app" class="wrap wide" hidden>
  <nav class="tabs" id="nav">
    <button data-view="students" class="active">Students</button>
    <button data-view="knowledge">Knowledge Hub</button>
    <button data-view="add" data-owner>+ Add student</button>
    <button data-view="reminders">Reminders</button>
    <button data-view="settings" data-owner>Settings</button>
  </nav>
  <section id="view"></section>
</main>
<script type="module" src="assets/js/admin.js"></script>
</body>
</html>
