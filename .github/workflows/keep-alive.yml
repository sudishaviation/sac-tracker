# Supabase pauses free projects after a week with no activity.
# This pings the database once a day so the tracker never sleeps.
# Needs two repository secrets: SUPABASE_URL and SUPABASE_KEY (the public publishable/anon key).
name: Keep Supabase awake
on:
  schedule:
    - cron: '17 3 * * *'   # every day 03:17 UTC
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$URL" ]; then echo "Secrets not set yet - skipping"; exit 0; fi
          curl -sf "$URL/rest/v1/settings?select=key&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" > /dev/null
          echo "Supabase is awake"
